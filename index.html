<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankie's Softball Recruiting Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans" x-data="cloudApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-baseball-bat-ball text-amber-400"></i> Frankie's Recruiting Hub
                </h1>
                <p class="text-indigo-200 text-xs">Cloud-Synced Across All Devices</p>
            </div>
            <div class="flex gap-2 w-full sm:w-auto justify-end">
                <button @click="openSchoolModal()" class="bg-amber-500 hover:bg-amber-600 text-indigo-950 font-semibold px-3 py-1.5 rounded-lg text-sm shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Add School
                </button>
                <button @click="openLogModal()" class="bg-indigo-700 hover:bg-indigo-600 text-white font-semibold px-3 py-1.5 rounded-lg text-sm shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-comments"></i> Log Note
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Error Banner -->
        <div x-show="errorMessage" class="mb-6 p-4 bg-rose-100 border border-rose-300 text-rose-800 rounded-xl text-sm font-semibold flex items-center justify-between" x-cloak>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-rose-600 text-lg"></i>
                <span x-text="errorMessage"></span>
            </div>
            <button @click="errorMessage = ''" class="text-rose-600 hover:text-rose-900">&times;</button>
        </div>

        <!-- Loading Spinner -->
        <div x-show="loading" class="text-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600 mb-2"></i>
            <p class="text-sm text-slate-500">Syncing database...</p>
        </div>

        <div x-show="!loading" x-cloak>
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6 gap-6">
                <button @click="activeTab = 'schools'" :class="activeTab === 'schools' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-2 border-b-2 font-semibold text-sm transition">
                    College Programs (<span x-text="schools.length"></span>)
                </button>
                <button @click="activeTab = 'timeline'" :class="activeTab === 'timeline' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'" class="pb-2 border-b-2 font-semibold text-sm transition">
                    Communication Log (<span x-text="logs.length"></span>)
                </button>
            </div>

            <!-- TAB 1: Schools -->
            <div x-show="activeTab === 'schools'">
                <div class="flex flex-col sm:flex-row justify-between gap-3 mb-6">
                    <input type="text" x-model="search" placeholder="Search college, mascot, coach..." class="w-full sm:w-72 px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                    <div class="flex gap-2">
                        <select x-model="divisionFilter" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                            <option value="">All Divisions</option>
                            <option value="DI">DI</option>
                            <option value="DII">DII</option>
                            <option value="DIII">DIII</option>
                            <option value="NAIA">NAIA</option>
                            <option value="NWAC">NWAC</option>
                            <option value="GNAC">GNAC</option>
                        </select>
                    </div>
                </div>

                <!-- Schools Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <template x-for="school in filteredSchools" :key="school.id">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 uppercase" x-text="school.division || 'N/A'"></span>
                                        <h3 class="text-base font-bold text-slate-900 mt-1" x-text="school.name"></h3>
                                        <p class="text-xs text-slate-500" x-text="school.mascot ? 'Mascot: ' + school.mascot : ''"></p>
                                    </div>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-amber-50 text-amber-700" x-text="school.interest || 'Tracking'"></span>
                                </div>

                                <!-- Coaches List -->
                                <div class="mt-3 pt-3 border-t border-slate-100 text-xs">
                                    <p class="font-bold text-slate-700 mb-1">Coaching Staff:</p>
                                    <template x-if="!school.coaches || school.coaches.length === 0">
                                        <p class="text-slate-400 italic">No coaches added</p>
                                    </template>
                                    <div class="space-y-1">
                                        <template x-for="c in school.coaches" :key="c.id">
                                            <div class="flex justify-between items-center text-slate-600 bg-slate-50 p-1.5 rounded">
                                                <div>
                                                    <span class="font-semibold text-slate-800" x-text="c.name"></span>
                                                    <span class="text-[10px] text-slate-500" x-text="'(' + (c.role || 'Coach') + ')'"></span>
                                                </div>
                                                <a x-show="c.email" :href="'mailto:' + c.email" class="text-indigo-600 hover:underline"><i class="fa-regular fa-envelope"></i></a>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Camps List -->
                                <div class="mt-3 pt-2 border-t border-slate-100 text-xs">
                                    <p class="font-bold text-rose-700 mb-1"><i class="fa-regular fa-calendar-days"></i> Upcoming Camps:</p>
                                    <template x-if="!school.camps || school.camps.length === 0">
                                        <p class="text-slate-400 italic">No camps scheduled</p>
                                    </template>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="camp in school.camps" :key="camp.id">
                                            <span class="bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded text-[11px] font-semibold" x-text="(camp.name ? camp.name + ': ' : '') + camp.camp_date"></span>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                                <button @click="editSchool(school)" class="text-slate-600 hover:text-indigo-600 font-medium flex items-center gap-1"><i class="fa-solid fa-pen"></i> Manage Program</button>
                                <button @click="deleteSchool(school.id)" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 2: Timeline -->
            <div x-show="activeTab === 'timeline'">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
                    <template x-for="log in logs" :key="log.id">
                        <div class="p-3 rounded-lg border border-slate-100 bg-slate-50 flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2 text-xs">
                                    <span class="font-bold text-indigo-900" x-text="getSchoolName(log.school_id)"></span>
                                    <span class="text-slate-400" x-text="log.date"></span>
                                    <span class="bg-slate-200 px-1.5 py-0.2 rounded text-[10px]" x-text="log.type"></span>
                                </div>
                                <p class="text-sm font-medium text-slate-800 mt-1" x-text="log.summary"></p>
                                <p class="text-xs text-slate-500" x-text="log.details"></p>
                            </div>
                            <button @click="deleteLog(log.id)" class="text-slate-400 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <!-- School Modal -->
    <div x-show="schoolModalOpen" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-white rounded-xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-lg font-bold text-indigo-950" x-text="editingId ? 'Manage Program Details' : 'Add New Program'"></h3>
                <button @click="schoolModalOpen = false" class="text-slate-400 hover:text-slate-700">&times;</button>
            </div>

            <form @submit.prevent="saveSchool()" class="space-y-4 text-xs">
                <!-- Main Info -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm">General Information</h4>
                    <div>
                        <label class="font-semibold block mb-1">College Name</label>
                        <input type="text" x-model="schoolForm.name" required class="w-full p-2 border rounded bg-slate-50">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="font-semibold block mb-1">Division</label>
                            <input type="text" x-model="schoolForm.division" placeholder="DI, DIII, NWAC..." class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="font-semibold block mb-1">Mascot</label>
                            <input type="text" x-model="schoolForm.mascot" placeholder="Wildcats, Huskies..." class="w-full p-2 border rounded">
                        </div>
                    </div>
                </div>

                <!-- Dynamic Coaches List -->
                <div class="space-y-2 border-t pt-3">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-slate-700 text-sm">Coaches</h4>
                        <button type="button" @click="addCoachRow()" class="text-indigo-600 font-semibold hover:underline"><i class="fa-solid fa-plus"></i> Add Coach</button>
                    </div>
                    <div class="space-y-2">
                        <template x-for="(c, idx) in schoolForm.coaches" :key="idx">
                            <div class="grid grid-cols-12 gap-1 items-center bg-slate-50 p-2 rounded border border-slate-200">
                                <input type="text" x-model="c.name" placeholder="Name" required class="col-span-4 p-1 border rounded">
                                <input type="text" x-model="c.role" placeholder="Role (e.g. Pitching Coach)" class="col-span-4 p-1 border rounded">
                                <input type="email" x-model="c.email" placeholder="Email" class="col-span-3 p-1 border rounded">
                                <button type="button" @click="removeCoachRow(idx)" class="col-span-1 text-rose-500 hover:text-rose-700 text-center"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Dynamic Camps List -->
                <div class="space-y-2 border-t pt-3">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-rose-700 text-sm">Camp Dates</h4>
                        <button type="button" @click="addCampRow()" class="text-rose-600 font-semibold hover:underline"><i class="fa-solid fa-plus"></i> Add Camp</button>
                    </div>
                    <div class="space-y-2">
                        <template x-for="(camp, idx) in schoolForm.camps" :key="idx">
                            <div class="grid grid-cols-12 gap-1 items-center bg-rose-50 p-2 rounded border border-rose-200">
                                <input type="text" x-model="camp.name" placeholder="Camp Name (e.g. Fall Prospect)" class="col-span-6 p-1 border rounded">
                                <input type="text" x-model="camp.camp_date" placeholder="Date (e.g. 9/26/26)" required class="col-span-5 p-1 border rounded">
                                <button type="button" @click="removeCampRow(idx)" class="col-span-1 text-rose-500 hover:text-rose-700 text-center"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="flex justify-end gap-2 border-t pt-3">
                    <button type="button" @click="schoolModalOpen = false" class="px-4 py-2 text-slate-600 font-medium">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded font-semibold shadow hover:bg-indigo-700">Save Program</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://uzhpfonasfmflwpwgkwb.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function cloudApp() {
            return {
                loading: true,
                errorMessage: '',
                activeTab: 'schools',
                search: '',
                divisionFilter: '',
                schools: [],
                logs: [],
                schoolModalOpen: false,
                logModalOpen: false,
                editingId: null,
                schoolForm: { name: '', division: '', mascot: '', interest: 'High Interest', coaches: [], camps: [] },
                logForm: { school_id: '', type: 'Email Sent', date: new Date().toISOString().split('T')[0], summary: '', details: '' },

                async init() {
                    await this.fetchData();
                },

                async fetchData() {
                    this.loading = true;
                    this.errorMessage = '';

                    // Relational query fetching schools along with all linked coaches and camps
                    const { data: schoolsData, error: schoolsError } = await supabaseClient
                        .from('schools')
                        .select('*, coaches(*), camps(*)')
                        .order('name');

                    const { data: logsData, error: logsError } = await supabaseClient
                        .from('communication_logs')
                        .select('*')
                        .order('date', { ascending: false });

                    if (schoolsError) {
                        console.error('Schools Fetch Error:', schoolsError);
                        this.errorMessage = 'Database Error: ' + schoolsError.message;
                    } else {
                        this.schools = schoolsData || [];
                    }

                    if (logsError) {
                        console.error('Logs Fetch Error:', logsError);
                    } else {
                        this.logs = logsData || [];
                    }

                    this.loading = false;
                },

                get filteredSchools() {
                    return this.schools.filter(s => {
                        const nameMatch = s.name ? s.name.toLowerCase().includes(this.search.toLowerCase()) : false;
                        const coachMatch = s.coaches ? s.coaches.some(c => c.name.toLowerCase().includes(this.search.toLowerCase())) : false;
                        const matchSearch = nameMatch || coachMatch;
                        const matchDiv = this.divisionFilter === '' || s.division === this.divisionFilter;
                        return matchSearch && matchDiv;
                    });
                },

                getSchoolName(id) {
                    const sch = this.schools.find(s => s.id === id);
                    return sch ? sch.name : 'Unknown School';
                },

                openSchoolModal() {
                    this.editingId = null;
                    this.schoolForm = { name: '', division: '', mascot: '', interest: 'High Interest', coaches: [], camps: [] };
                    this.schoolModalOpen = true;
                },

                editSchool(school) {
                    this.editingId = school.id;
                    this.schoolForm = {
                        name: school.name,
                        division: school.division,
                        mascot: school.mascot,
                        interest: school.interest || 'High Interest',
                        coaches: school.coaches ? JSON.parse(JSON.stringify(school.coaches)) : [],
                        camps: school.camps ? JSON.parse(JSON.stringify(school.camps)) : []
                    };
                    this.schoolModalOpen = true;
                },

                addCoachRow() {
                    this.schoolForm.coaches.push({ name: '', role: 'Coach', email: '' });
                },

                removeCoachRow(idx) {
                    this.schoolForm.coaches.splice(idx, 1);
                },

                addCampRow() {
                    this.schoolForm.camps.push({ name: 'Prospect Camp', camp_date: '' });
                },

                removeCampRow(idx) {
                    this.schoolForm.camps.splice(idx, 1);
                },

                async saveSchool() {
                    this.loading = true;
                    let schoolId = this.editingId;

                    // 1. Upsert School Main Record
                    if (schoolId) {
                        await supabaseClient.from('schools').update({
                            name: this.schoolForm.name,
                            division: this.schoolForm.division,
                            mascot: this.schoolForm.mascot,
                            interest: this.schoolForm.interest
                        }).eq('id', schoolId);
                    } else {
                        const { data } = await supabaseClient.from('schools').insert([{
                            name: this.schoolForm.name,
                            division: this.schoolForm.division,
                            mascot: this.schoolForm.mascot,
                            interest: this.schoolForm.interest
                        }]).select().single();
                        if (data) schoolId = data.id;
                    }

                    if (schoolId) {
                        // 2. Refresh linked Coaches
                        await supabaseClient.from('coaches').delete().eq('school_id', schoolId);
                        if (this.schoolForm.coaches.length > 0) {
                            const coachPayload = this.schoolForm.coaches.map(c => ({
                                school_id: schoolId,
                                name: c.name,
                                role: c.role,
                                email: c.email
                            }));
                            await supabaseClient.from('coaches').insert(coachPayload);
                        }

                        // 3. Refresh linked Camps
                        await supabaseClient.from('camps').delete().eq('school_id', schoolId);
                        if (this.schoolForm.camps.length > 0) {
                            const campPayload = this.schoolForm.camps.map(c => ({
                                school_id: schoolId,
                                name: c.name,
                                camp_date: c.camp_date
                            }));
                            await supabaseClient.from('camps').insert(campPayload);
                        }
                    }

                    this.schoolModalOpen = false;
                    await this.fetchData();
                },

                async deleteSchool(id) {
                    if (confirm('Delete this program and all associated coaches and camps?')) {
                        await supabaseClient.from('schools').delete().eq('id', id);
                        await this.fetchData();
                    }
                }
            }
        }
    </script>
</body>
</html>
