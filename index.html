<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softball Recruiting Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased" x-data="cloudApp">
    
    <!-- Global Notifications -->
    <div x-show="toastMessage" class="fixed top-4 right-4 bg-emerald-600 text-white px-4 py-2 rounded shadow-lg z-50 transition-opacity" x-text="toastMessage" x-transition></div>
    <div x-show="errorMessage" class="fixed top-4 right-4 bg-rose-600 text-white px-4 py-2 rounded shadow-lg z-50 transition-opacity" x-text="errorMessage" x-transition></div>

    <!-- Top Navigation -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-baseball text-2xl text-indigo-200"></i>
                <h1 class="text-xl font-bold tracking-tight">Recruiting Hub</h1>
            </div>
            
            <!-- Athlete Selector -->
            <div class="flex items-center gap-2" x-show="athletes.length > 0">
                <i class="fa-solid fa-user text-indigo-300"></i>
                <select x-model="selectedAthleteId" @change="switchAthlete" class="bg-indigo-800 border border-indigo-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2">
                    <template x-for="athlete in athletes" :key="athlete.id">
                        <option :value="athlete.id" x-text="athlete.name"></option>
                    </template>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 flex-shrink-0">
            <nav class="space-y-1">
                <button @click="activeTab = 'schools'" :class="{'bg-indigo-50 text-indigo-700': activeTab === 'schools', 'text-slate-600 hover:bg-slate-100': activeTab !== 'schools'}" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-left">
                    <i class="fa-solid fa-graduation-cap w-5"></i> College Programs
                </button>
                <button @click="activeTab = 'profile'" :class="{'bg-indigo-50 text-indigo-700': activeTab === 'profile', 'text-slate-600 hover:bg-slate-100': activeTab !== 'profile'}" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-left">
                    <i class="fa-solid fa-id-card w-5"></i> Athlete Profile
                </button>
                <button @click="activeTab = 'calendar'" :class="{'bg-indigo-50 text-indigo-700': activeTab === 'calendar', 'text-slate-600 hover:bg-slate-100': activeTab !== 'calendar'}" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-left">
                    <i class="fa-solid fa-calendar-days w-5"></i> Master Calendar
                </button>
                <button @click="activeTab = 'timeline'" :class="{'bg-indigo-50 text-indigo-700': activeTab === 'timeline', 'text-slate-600 hover:bg-slate-100': activeTab !== 'timeline'}" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-left">
                    <i class="fa-solid fa-comments w-5"></i> Communication Log
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 min-w-0">
            
            <!-- Loading Indicator -->
            <div x-show="loading" class="flex justify-center items-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600"></i>
            </div>

            <!-- Content Wrapper (Hidden while loading) -->
            <div x-show="!loading">

                <!-- TAB 1: College Programs -->
                <div x-show="activeTab === 'schools'" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Target Schools</h2>
                            <p class="text-slate-500 text-sm">Manage recruiting targets and coach contacts.</p>
                        </div>
                        <button @click="openSchoolModal" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm shadow transition">
                            <i class="fa-solid fa-plus mr-1"></i> Add School
                        </button>
                    </div>

                    <!-- Filter Bar -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" x-model="search" placeholder="Search schools..." class="border-slate-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500 w-full">
                        <!-- Add select dropdowns bound to x-model="divisionFilter", etc. here -->
                    </div>

                    <!-- Schools Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <template x-for="school in filteredSchools" :key="school.id">
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                <h3 class="text-lg font-bold text-slate-900" x-text="school.name"></h3>
                                <p class="text-sm text-slate-500" x-text="school.mascot"></p>
                            </div>
                        </template>
                        <template x-if="filteredSchools.length === 0">
                            <div class="col-span-full text-center py-12 text-slate-500">
                                No programs found matching your criteria.
                            </div>
                        </template>
                    </div>
                </div>

                <!-- TAB 2: Athlete Profile -->
                <div x-show="activeTab === 'profile'" class="space-y-6">
                    <h2 class="text-2xl font-bold text-slate-900">Athlete Profile</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <p class="text-slate-500">Profile stats, questionnaires, and social links go here.</p>
                    </div>
                </div>

                <!-- TAB 3: Master Calendar -->
                <div x-show="activeTab === 'calendar'" class="space-y-6">
                    <h2 class="text-2xl font-bold text-slate-900">Master Calendar</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <p class="text-slate-500">Tournament schedules, camp dates, and upcoming calls go here.</p>
                    </div>
                </div>

                <!-- TAB 4: Communication Timeline -->
                <div x-show="activeTab === 'timeline'" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-slate-900">Communication Log</h2>
                        <button @click="openLogModal" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm shadow transition">
                            <i class="fa-solid fa-plus mr-1"></i> Log Interaction
                        </button>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                        <template x-for="log in logs" :key="log.id">
                            <div class="border-b border-slate-100 pb-4 last:border-0 last:pb-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded uppercase" x-text="log.interaction_type || 'Note'"></span>
                                    <span class="text-sm font-bold text-slate-900" x-text="log.schoolName || 'General'"></span>
                                </div>
                                <p class="text-sm text-slate-600 whitespace-pre-line" x-text="log.notes"></p>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Configuration and Application Logic Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
